name: Build ESP32-C5 Repeater

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix project structure
        run: |
          echo "Naprawiam strukture katalogow i kolejnosc naglowkow..."
          mkdir -p main
          
          find . -maxdepth 2 -name "main.c" -exec cp {} main/main.c \;
          
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(xiao_c5_repeater)
          EOF
          
          cat << 'EOF' > main/CMakeLists.txt
          idf_component_register(SRCS "main.c"
                                 INCLUDE_DIRS "."
                                 REQUIRES esp_wifi nvs_flash esp_event esp_netif lwip)
          EOF
          
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_LWIP_NAPT=y
          CONFIG_LWIP_PORTMAP=y
          CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=10
          CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=32
          CONFIG_ESP_WIFI_TX_BUFFER_TYPE=1
          CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
          EOF

          cat << 'EOF' > fix_code.py
          import re
          with open('main/main.c', 'r') as f:
              code = f.read()
          
          code = re.sub(r'#include "lwip/lwip_napt\.h".*?\n', '', code)
          code = re.sub(r'#include "lwip/sockets\.h".*?\n', '', code)
          code = re.sub(r'#ifndef IP_PROTO_TCP\n#define IP_PROTO_TCP 6\n#endif\n', '', code)
          
          correct_headers = """
          #include "lwip/opt.h"
          #include "lwip/sockets.h"
          #include "lwip/lwip_napt.h"
          #ifndef IP_PROTO_TCP
          #define IP_PROTO_TCP 6
          #endif
          """
          
          code = code.replace('#include "nvs_flash.h"', '#include "nvs_flash.h"\n' + correct_headers)
          
          with open('main/main.c', 'w') as f:
              f.write(code)
          EOF
          python3 fix_code.py

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          # Usunięcie blokady konfiguracji (auto-akceptacja nowości)
          export BATCH_BUILD=1
          export IDF_TARGET=esp32c5
          # Generowanie czystej konfiguracji przed budową
          idf.py set-target esp32c5
          idf.py reconfigure
          idf.py build
          esptool.py --chip esp32c5 merge_bin -o build/merged-repeater-esp32c5.bin @build/flash_args

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c5-repeater-firmware
          path: build/merged-repeater-esp32c5.bin
          
